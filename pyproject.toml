[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pgx-interpretation-pipeline"
version = "0.0.1"
description = "Reproducible pharmacogenomics interpretation workflow: VCF -> allele/diplotype -> functional phenotype -> guideline-linked drug recommendation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Krzysztof Gizynski" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Phase 6: pgx_interpreter.report.to_docx() only. Every other renderer
# (to_json/to_tsv/to_html/to_markdown) is stdlib-only and needs nothing
# from this extra.
docx = [
    "python-docx>=1.1",
]

# Phase 9: optional convenience so `pgx-interpreter report ...` works
# directly after `pip install -e .`, without needing `python3 -m
# pgx_interpreter.cli` or a manually-set PYTHONPATH. main.nf itself still
# invokes the module form directly (PYTHONPATH=<projectDir> python3 -m
# pgx_interpreter.cli ...) so a real run never depends on this package
# actually being installed -- see main.nf's own header comment.
[project.scripts]
pgx-interpreter = "pgx_interpreter.cli:main"

[tool.setuptools.packages.find]
include = ["pgx_interpreter*"]
